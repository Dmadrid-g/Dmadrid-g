<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Daniel Madrid, estudiante de Ingeniería de Software">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1247"/>
      <stop offset="0.5" stop-color="#4a2a86"/>
      <stop offset="1" stop-color="#8e3fc4"/>
    </linearGradient>
    <radialGradient id="glowMagenta" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b02fd0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b02fd0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a00" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff8a00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc85a" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffc85a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd98a"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="900" height="260" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <circle cx="800" cy="40" r="230" fill="url(#glowMagenta)"/>
    <circle cx="760" cy="290" r="210" fill="url(#glowOrange)"/>
    <circle cx="560" cy="300" r="150" fill="url(#glowAmber)"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="259" rx="18" fill="none" stroke="#c9a8f0" stroke-opacity="0.35"/>

  <text x="48" y="62" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#ffc85a">DANIEL MADRID · INGENIERÍA DE SOFTWARE</text>

  <text x="48" y="128" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="url(#title)" textLength="770" lengthAdjust="spacingAndGlyphs">Construyo con código y datos.</text>

  <text x="48" y="170" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#eadfff">Python, React, Node.js y proyectos de IoT con ESP32.</text>

  <rect x="48" y="200" width="150" height="36" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="#d6bcf7" stroke-opacity="0.55"/>
  <text x="123" y="223" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#f3ecff">Python · Datos</text>

  <rect x="210" y="200" width="140" height="36" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="#d6bcf7" stroke-opacity="0.55"/>
  <text x="280" y="223" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#f3ecff">IoT · ESP32</text>

  <rect x="362" y="200" width="250" height="36" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="#ffc85a" stroke-opacity="0.65"/>
  <circle cx="386" cy="218" r="5" fill="#ffb020">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="402" y="223" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#f3ecff">Disponible para prácticas</text>
</svg>
