<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Daniel Madrid, estudiante de Ingeniería de Software">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b0b3a"/>
      <stop offset="0.55" stop-color="#3b1b7a"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9d5ff"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="900" height="260" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <circle cx="790" cy="50" r="230" fill="url(#glow1)"/>
    <circle cx="640" cy="280" r="190" fill="url(#glow2)"/>
    <circle cx="40" cy="290" r="150" fill="url(#glow2)"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="259" rx="18" fill="none" stroke="#a78bfa" stroke-opacity="0.35"/>

  <text x="48" y="64" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#c4b5fd">DANIEL MADRID · INGENIERÍA DE SOFTWARE</text>

  <text x="48" y="126" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="url(#title)">Construyo con código y datos.</text>

  <text x="48" y="164" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#ddd6fe">Python, React, Node.js y proyectos de IoT con ESP32.</text>

  <rect x="48" y="196" width="130" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#c4b5fd" stroke-opacity="0.5"/>
  <text x="113" y="217" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#ede9fe">Python · Datos</text>

  <rect x="190" y="196" width="130" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#c4b5fd" stroke-opacity="0.5"/>
  <text x="255" y="217" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#ede9fe">IoT · ESP32</text>

  <rect x="332" y="196" width="222" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#c4b5fd" stroke-opacity="0.5"/>
  <circle cx="354" cy="212" r="4" fill="#4ade80">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="368" y="217" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#ede9fe">Disponible para prácticas</text>
</svg>
