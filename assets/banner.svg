<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Daniel Madrid Giraldo, estudiante de Ingeniería de Software">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a2030"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8b949e"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="900" height="260" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <circle cx="800" cy="40" r="170" fill="#1f6feb" opacity="0.10"/>
    <circle cx="700" cy="250" r="120" fill="#3fb950" opacity="0.07"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="259" rx="18" fill="none" stroke="#30363d"/>

  <text x="48" y="64" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#8b949e">DANIEL MADRID · INGENIERÍA DE SOFTWARE</text>

  <text x="48" y="126" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="url(#title)">Construyo con código y datos.</text>

  <text x="48" y="164" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9da7b3">Python, React, Node.js y proyectos de IoT con ESP32.</text>

  <rect x="48" y="196" width="130" height="32" rx="16" fill="#161b22" stroke="#30363d"/>
  <text x="113" y="217" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#c9d1d9">Python · Datos</text>

  <rect x="190" y="196" width="130" height="32" rx="16" fill="#161b22" stroke="#30363d"/>
  <text x="255" y="217" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#c9d1d9">IoT · ESP32</text>

  <rect x="332" y="196" width="222" height="32" rx="16" fill="#161b22" stroke="#30363d"/>
  <circle cx="354" cy="212" r="4" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="368" y="217" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#c9d1d9">Disponible para prácticas</text>
</svg>
